substitutions:
  devicename: atomlite-distance

esphome:
  name: $devicename
  name_add_mac_suffix: true
  platformio_options:
    build_flags:
      - -D CORE_DEBUG_LEVEL=0
      - -D ARDUINO_LOG_LEVEL=0

esp32:
  board: m5stack-atom
  framework:
    type: arduino
    version: latest

uart:
  id: uart_bus
  rx_pin: 22
  tx_pin: 19
  baud_rate: 115200

# Declare the Modbus component and link it to the UART bus
modbus:
  id: modbus_bus
  uart_id: uart_bus

# Configure the Modbus Controller (The SEN0592 Sensor)
modbus_controller:
  - id: sen0592
    modbus_id: modbus_bus
    # 0x01 is the standard default Modbus address for DFRobot sensors. 
    # If the sensor is unresponsive, it may be set to 0x11 (17) instead.
    address: 0x01
    setup_priority: -10
    update_interval: 1s

# Read the specific Modbus Holding Register for Distance
sensor:
  - platform: modbus_controller
    name: distance
    modbus_controller_id: sen0592
    id: distance_mm
    register_type: holding
    address: 0x0101         # DFRobot register for distance
    value_type: U_WORD      # 16-bit unsigned integer
    unit_of_measurement: "mm"
    accuracy_decimals: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  output_power: 15dB
  power_save_mode: none
  ap:
  manual_ip:
    static_ip: 192.168.105.70
    gateway: 192.168.105.123
    subnet: 255.255.255.0
    dns1: 8.8.8.8

captive_portal:

improv_serial:

logger:
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  include_internal: false
  version: 3

